#
# Colors come from matugen (colors.conf). Layout:
#   center: clock, date, greeting, password field
#   bottom: now playing (left), keyboard layout (center), battery (right)

source = colors.conf

$font_regular = RobotoMono Nerd Font
$font_bold    = RobotoMono Nerd Font Bold

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2500
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

# Wallpaper set by apply-wal (Super+W); hyprlock blurs and dims it
background {
    monitor =
    path = $HOME/.cache/lockscreen.png
    color = $surface
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.2
    noise = 0.01
}

# ---- Clock -------------------------------------------------------------------

label {
    monitor =
    text = $TIME12
    color = $on_surface
    font_size = 96
    font_family = $font_bold
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shadow
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $primary
    font_size = 20
    font_family = $font_regular
    position = 0, 105
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 4
    shadow_color = $shadow
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/hyprlock-time.sh
    color = $on_surface_variant
    font_size = 14
    font_family = $font_regular
    position = 0, 40
    halign = center
    valign = center
}

# ---- Password ----------------------------------------------------------------

input-field {
    monitor =
    size = 320, 56
    position = 0, -40
    halign = center
    valign = center

    rounding = 12
    outline_thickness = 2
    outer_color = $outline_variant
    inner_color = $surface_container_alpha
    font_color = $on_surface
    font_family = $font_regular

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    placeholder_text = <span alpha="60%">󰌾  Password</span>
    fade_on_empty = false
    hide_input = false

    check_color = $tertiary
    check_text = <i>Checking...</i>
    fail_color = $error
    fail_text = <b>$FAIL</b> ($ATTEMPTS)
    capslock_color = $tertiary

    shadow_passes = 2
    shadow_size = 8
    shadow_color = $shadow
}

label {
    monitor =
    text = cmd[update:500:true] [ "$(cat /sys/class/leds/*capslock/brightness 2>/dev/null | sort -r | head -1)" = 1 ] && echo "󰘲  Caps Lock is on"
    color = $tertiary
    font_size = 12
    font_family = $font_regular
    position = 0, -90
    halign = center
    valign = center
}

# ---- Bottom bar --------------------------------------------------------------

label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '󰝚  {{title}} — {{artist}}' 2>/dev/null | cut -c1-60
    color = $on_surface_variant
    font_size = 12
    font_family = $font_regular
    position = 40, 30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $on_surface_variant
    font_size = 12
    font_family = $font_regular
    position = 0, 30
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/hyprlock-battery.sh
    color = $on_surface_variant
    font_size = 12
    font_family = $font_regular
    position = -40, 30
    halign = right
    valign = bottom
}

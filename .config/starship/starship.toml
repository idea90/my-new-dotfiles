# Starship prompt. GENERATED by matugen from ~/.config/matugen/template/starship.toml
# Edit the template, not this file. Colors follow the wallpaper (Super+W).
#
#   ╭─ [os user ~/dir] [ branch +2 !1] [ 3.12]          took 4s
#   ╰─❯

"$schema" = 'https://starship.rs/config-schema.json'

palette = "matugen"
add_newline = true
command_timeout = 800

format = """
[╭─](fg:subtle)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$all\
$line_break\
[╰─](fg:subtle)$character"""

right_format = "$cmd_duration$jobs$status"

[palettes.matugen]
primary = "#ffb4a9"
on_primary = "#561e18"
secondary = "#5d3f3b"
on_secondary = "#ffdad5"
tertiary = "#574419"
on_tertiary = "#fcdfa6"
surface = "#322826"
on_surface = "#f1dedc"
subtle = "#a08c89"
accent = "#ffb4a9"
error = "#ffb4ab"
warn = "#dfc38c"

# ---- Left pill: os, user, directory ---------------------------------------

[os]
disabled = false
format = "[](fg:primary)[$symbol](bg:primary fg:on_primary)"

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

[username]
show_always = true
format = "[ $user ](bg:primary fg:on_primary bold)[](fg:primary bg:surface)"

[hostname]
ssh_only = true
ssh_symbol = "󰌘 "
format = "[ $ssh_symbol$hostname ](bg:surface fg:on_surface)"

[directory]
format = "[ $path ](bg:surface fg:on_surface bold)[$read_only](bg:surface fg:error)[](fg:surface) "
read_only = "󰌾 "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Scripts" = "󰲋 "

# ---- Git pill (only inside a repo) ----------------------------------------

[git_branch]
symbol = " "
format = "[](fg:secondary)[$symbol$branch(:$remote_branch)](bg:secondary fg:on_secondary)"

[git_state]
format = "[ $state( $progress_current/$progress_total)](bg:secondary fg:warn bold)"

[git_status]
format = "([ $all_status$ahead_behind](bg:secondary fg:on_secondary))[](fg:secondary) "
conflicted = "=${count} "
ahead = "󰁝${count} "
behind = "󰁅${count} "
diverged = "󰹹󰁝${ahead_count}󰁅${behind_count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "󰅖${count} "

[git_metrics]
disabled = true

[git_commit]
tag_symbol = "  "
format = "[ $hash$tag](fg:subtle) "

# ---- Second line + right side ---------------------------------------------

[character]
success_symbol = "[❯](bold fg:accent)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:warn)"

[cmd_duration]
min_time = 2000
format = "[took $duration ](fg:subtle)"

[jobs]
symbol = "󰰽 "
format = "[$symbol$number ](fg:warn)"

[status]
disabled = false
symbol = "󰅖"
format = "[$symbol$status ](fg:error)"


# ---- Languages / tools: quiet, after the git pill -------------------------

